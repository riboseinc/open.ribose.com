name: hub-build

# Manual only until cutover (TODO.impl/09): no automatic runs yet.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hub-dist
          path: hub/dist

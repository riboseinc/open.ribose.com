platforms:
  - id: metanorma
    name: Metanorma
    tagline: Author once, publish in any standards flavor
    story: The end-to-end chain for standards documents -- modelling,
      identifiers, citations, math, typography, publication.
    core: metanorma
    suites: [metanorma, relaton, pubid, glossarist, geolexica, plurimath,
             fontist, metfont, lutaml]

  - id: primmel-digital-cab
    name: Primmel Digital CAB
    vendor: Ribose
    tagline: Executable standards — authored in Primmel, run for trusted evidence and continuous compliance
    story: >
      Two audiences, one platform. Standards bodies author executable
      standards in the Primmel modelling language. Organizations run
      those standards on the Primmel runtime: their implementation
      model mapped against the standard's reference model, producing
      trusted evidence and continuous compliance -- conformity
      assessment, certificates and accreditation, digitally, end to
      end. Deployed for an international standards body and
      generalizable to any SDO and CAB.
    editions:
      - id: smart
        name: SMART
        description: Digital-native, executable standards — machine-readable models that platforms run directly, end-to-end digital workflows, and digital certificates
      - id: smart-plus
        name: SMART+
        description: Digitalizes new aspects of the business — digital twins of real-world assets and processes, continuous compliance, and Trusted Artifacts (verifiably sealed data)
    builds_on: metanorma
    core: primmel
    suites: [primmel, edoxen, pubid, glossarist, confium, rnp]
